<svg xmlns="http://www.w3.org/2000/svg" width="384" height="960" viewBox="0 0 384 960" font-family="-apple-system, system-ui, sans-serif" fill="#fff" stroke="#000" stroke-width="1.5" role="img" aria-labelledby="title desc">
<title id="title">工单列表 — error — 384×960</title>
<desc id="desc">低保真静态设计，所有数据为合成示例，控件不可操作。1 现有导航；2 工具栏；3 状态筛选；4 列表或状态；5 分页。手机画布加长以展示滚动后内容。</desc>
<!-- 384×960; 8px grid; static design only -->
<rect x="0" y="0" width="384" height="960" rx="8" fill="#fff"/>
<rect x="0" y="0" width="384" height="56" rx="8" fill="#fff"/>
<text x="24" y="32" font-size="14" fill="#000" stroke="none">1  管理后台 · 工单</text>
<text x="16" y="104" font-size="28" fill="#000" stroke="none">工单列表</text>
<text x="16" y="136" font-size="12" fill="#666" stroke="none">2  刷新 / 列显示 / 重置</text>
<rect x="16" y="152" width="80" height="48" rx="8" fill="#fff"/>
<text x="24" y="184" font-size="14" fill="#000" stroke="none">刷新</text>
<rect x="104" y="152" width="112" height="48" rx="8" fill="#fff"/>
