<text x="296" y="280" font-size="14" fill="#000" stroke="none">清除</text>
<text x="16" y="328" font-size="12" fill="#666" stroke="none">4  当前页结果 · 示例数据</text>
<rect x="16" y="352" width="352" height="240" rx="8" fill="#fff"/>
