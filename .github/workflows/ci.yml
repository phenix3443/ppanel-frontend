name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# 同一个 PR 连推几次时，只留最后一次——前面那些的结论已经没意义了。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          # 【不要用 latest】CI 和本机跑的必须是同一个 bun，否则「本机过了 CI 挂」
          # 这种问题查起来没有下手的地方。这个值和 package.json 的 packageManager 一致。
          bun-version: 1.3.1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --frozen-lockfile：锁文件和 package.json 对不上就失败，而不是悄悄改锁文件。
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      # build 里含 tsc（各 app 的 build 是 "vite build && tsc"），类型错误在这里暴露。
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
